name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # main takes pull requests from dev only; every other branch lands in dev first.
  main-from-dev:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Source branch is dev
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::Pull requests into main come from dev only, not from $HEAD_REF."
            exit 1
          fi
        env:
          HEAD_REF: ${{ github.head_ref }}

  # The gate's steps run as parallel jobs; `gate` itself is the required check and only collects them.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/prettier
          key:
            prettier-${{ hashFiles('pnpm-lock.yaml', '.prettierrc.json', '.prettierignore') }}-${{
            github.sha }}
          restore-keys:
            prettier-${{ hashFiles('pnpm-lock.yaml', '.prettierrc.json', '.prettierignore') }}-
      - name: Format
        run: pnpm format:check
      - name: Validate specifications
        run: pnpm spec:validate

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint:shard ${{ matrix.shard }}/3

  typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Compiler tests
        run: pnpm test:compiler
      - name: Build
        run: pnpm build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/3

  gate:
    if: always()
    needs: [format, lint, typecheck-build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Every gate job passed
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "::error::A gate job failed, was cancelled or skipped."
            exit 1
          fi
        env:
          FAILED:
            ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
            contains(needs.*.result, 'skipped') }}
